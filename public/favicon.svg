<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle - dark crimson -->
  <rect width="64" height="64" rx="14" fill="#1A0510"/>
  <!-- Outer gold ring -->
  <circle cx="32" cy="32" r="26" stroke="#C9A84C" stroke-width="1.5" fill="none" opacity="0.6"/>
  <!-- Inner decorative ring -->
  <circle cx="32" cy="32" r="20" stroke="#C9A84C" stroke-width="0.75" fill="none" opacity="0.3"/>
  <!-- "A" letter - crimson -->
  <text x="32" y="42" font-family="Georgia, serif" font-size="30" font-weight="900" fill="#8B1A4A" text-anchor="middle" letter-spacing="-1">A</text>
  <!-- Gold accent dots -->
  <circle cx="32" cy="8" r="2" fill="#C9A84C"/>
  <circle cx="32" cy="56" r="2" fill="#C9A84C"/>
</svg>
